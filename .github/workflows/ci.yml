name: CI

on:
  # Tags are not pushed by hand: CI creates them when the version changes (see the version job).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first and decides whether this run releases (outputs.release): the main branch has a version in
  # project.jsonc that has no tag yet, so CI tags this commit once the tests pass.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        run: |
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            release=true
            echo "::notice::$version has no release yet: releasing it"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release ($version)"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install jpm
        run: |
          curl -fsSL https://github.com/java-package-manager/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
          # the layout engine needs "javacArgs" with --add-exports, which jpm 0.7.1 compiles (no --release)
          v=$("$HOME/.jpm/bin/jpm" --version | cut -d' ' -f2)
          printf '%s\n%s\n' "0.7.1" "$v" | sort -V -C || { echo "::error::jpm $v is too old; jpm-format needs 0.7.1 or newer"; exit 1; }

      - name: No comments in jpm-format's own sources
        run: java checks/Comments.java check src test '!src/dev/jpm/format/palantir'

      - name: Test
        # --frozen once project.lock is committed
        run: if [ -f project.lock ]; then jpm test --frozen; else jpm test; fi

      - name: Build
        run: jpm build

      - name: Format check of itself
        # `jpm start` runs main on the runtime classpath, as an installed extension does;
        # GitHub annotations are picked automatically in Actions
        run: jpm start -- --check

  # jpm installs extensions from their Git source, so a release is just a tag: it is what
  # `jpm add -g github:java-package-manager/jpm-format` resolves (^<version>) instead of the main branch.
  tag:
    name: tag
    if: needs.version.outputs.release == 'true'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag this commit with its version
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION is already tagged"
            exit 0
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          echo "::notice::tagged $GITHUB_SHA as $VERSION"
