name: CI

# Every commit to main and every pull request runs the full check, once: a pull request's branch is checked as
# the pull request, not again as a push. Releases come from changesets only (the release job); nothing else
# creates tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # the whole history, so `jpm changeset status --check` (part of `jpm check`) can compare with origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: java-package-manager/setup-jpm@v1
        with:
          java: "21"

      - name: No comments in jpm-format's own sources
        run: java checks/Comments.java check src test '!src/dev/jpm/format/palantir'

      # every check of jpm and its extensions (among them: every change has a changeset), then the tests
      - name: Check
        run: jpm check --frozen

      - name: Build
        run: jpm build

      - name: Format check of itself
        # `jpm start` runs main on the runtime classpath, as an installed extension does;
        # GitHub annotations are picked automatically in Actions
        run: jpm start -- --check

  # How far the formatter is from IntelliJ's on real projects (checks/Parity.java, CONTRIBUTING.md): the count may only
  # go down. The IntelliJ build is the one checks/parity/baseline.txt was measured with; it is cached between runs,
  # and so is its output for the corpus.
  parity:
    runs-on: ubuntu-latest
    env:
      IDEA_VERSION: "2026.1.5.1"
    steps:
      - uses: actions/checkout@v7

      - uses: java-package-manager/setup-jpm@v1
        with:
          java: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/idea
            .cache/parity
          key: parity-idea-${{ env.IDEA_VERSION }}-${{ hashFiles('checks/parity/corpus.txt') }}

      - name: IntelliJ IDEA
        run: |
          if [ ! -x "$RUNNER_TEMP/idea/bin/format.sh" ]; then
            mkdir -p "$RUNNER_TEMP/idea"
            curl -fsSL "https://download.jetbrains.com/idea/ideaIU-$IDEA_VERSION.tar.gz" | tar xz --strip-components=1 -C "$RUNNER_TEMP/idea"
          fi

      - name: Parity with IntelliJ
        run: |
          jpm build --bundle
          java checks/Parity.java --idea "$RUNNER_TEMP/idea" --show 5

  # jpm-changeset (CONTRIBUTING.md): while changesets are pending, keep a "Version packages" pull request with
  # the bumped version and CHANGELOG.md; once it is merged, tag the commit and create a GitHub release with the
  # changelog entry. jpm installs extensions from their Git source, so the tag is the release: it is what
  # `jpm add -g github:java-package-manager/jpm-format` resolves (^<version>). Nothing goes to a Maven repository.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: java-package-manager/setup-jpm@v1
        with:
          java: "21"

      - uses: java-package-manager/changeset-action@v1
